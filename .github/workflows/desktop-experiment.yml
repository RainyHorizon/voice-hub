name: Tauri 2 Desktop Experiment

on:
  push:
    branches: [experiment/tauri2-desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build Tauri 2 Windows desktop package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Locate FFmpeg distribution
        shell: pwsh
        run: |
          $searchRoots = @(
            'C:\Program Files\FFmpeg',
            'C:\ProgramData\chocolatey\lib',
            'C:\ProgramData\chocolatey\bin'
          )
          $resolvedBin = $null
          foreach ($root in $searchRoots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            $ffmpegFiles = Get-ChildItem -LiteralPath $root -Filter 'ffmpeg.exe' -File -Recurse -ErrorAction SilentlyContinue
            foreach ($ffmpegFile in $ffmpegFiles) {
              $bin = $ffmpegFile.Directory.FullName
              $ffprobe = Join-Path $bin 'ffprobe.exe'
              $license = Get-ChildItem -LiteralPath (Split-Path -Parent $bin) -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('LICENSE', 'COPYING.GPLv3', 'COPYING.GPLv2', 'COPYING.LGPLv3', 'COPYING.LGPLv2.1') } |
                Select-Object -First 1
              if ((Test-Path -LiteralPath $ffprobe -PathType Leaf) -and $license) {
                $resolvedBin = $bin
                break
              }
            }
            if ($resolvedBin) { break }
          }
          if (-not $resolvedBin) { throw '未找到同时包含 ffmpeg.exe、ffprobe.exe 和许可证文件的 FFmpeg 发布目录。' }
          "FFMPEG_BIN=$resolvedBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable backend runtime
        shell: pwsh
        run: .\build-windows-portable.ps1 -Version "desktop-${{ github.run_number }}" -FfmpegBinDirectory $env:FFMPEG_BIN

      - name: Stage portable backend for Tauri
        shell: pwsh
        run: |
          $archive = Get-Item 'output/releases/VoiceHub-desktop-*-Windows-Portable.zip' | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'voice-hub-portable'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'desktop/src-tauri/backend-runtime'
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          if (Test-Path -LiteralPath $runtime) { Remove-Item -LiteralPath $runtime -Recurse -Force }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $portable = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Get-ChildItem -LiteralPath $portable.FullName -Force | Copy-Item -Destination $runtime -Recurse -Force

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri desktop package
        working-directory: desktop
        run: npm run build

      - name: Upload Tauri installer
        uses: actions/upload-artifact@v4
        with:
          name: VoiceHub-Tauri2-Windows-${{ github.run_number }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
